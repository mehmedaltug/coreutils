name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: release-linux-x64.zip
          - os: windows-latest
            artifact_name: release-windows-x64.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Install GCC and Make on Windows via MSYS2
      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc

      # Build step for Linux
      - name: Run Make (Linux)
        if: runner.os == 'Linux'
        run: make

      # Build step for Windows
      - name: Run Make (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make

      # Cross-platform packaging using PowerShell (pre-installed on both Ubuntu and Windows runners)
      - name: Zip non-directory files in out/
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $files = Get-ChildItem -Path "out" -File
          if ($files.Count -eq 0) {
            Write-Error "No files found in out/ directory."
            exit 1
          }
          Compress-Archive -Path $files.FullName -DestinationPath "dist/${{ matrix.artifact_name }}"

      # Upload zipped artifacts directly to the GitHub Release on tag push
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/${{ matrix.artifact_name }}
